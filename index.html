<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaffeNco</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Font Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- NAVBAR -->
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <img src="logo.png" alt="Logo" width="45" height="45" class="d-inline-block align-text-top">
                CaffeNco
            </a>
            <ul class="navbar-nav ms-auto flex-row align-items-center gap-4">
                <li class="nav-item ">
                <a class="navbar-link active" href="#">
                Home</a>
                </li>
                <li class="nav-item">
                <a class="navbar-link" href="#footer">
                About Us</a>
                </li>
            </ul>
        </div>
    </nav>
<!-- CONTENT -->
    <main class="container main-content">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card form-card">
                    <div class="card-header bg-secondary text-white">
                        <h4 class="mb-0">Kasir CaffeNco</h4>
                    </div>
                    <div class="card-body">
                        <form id="csnameform">
                            <div class="mb-3">
                                <label for="nama" class="form-label">
                                    Customer Name
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="nama"
                                    placeholder="Enter Customer Name"
                                    required
                                >
                            </div>
                            <div class="mb-3">
                                <label for="pesan" class="form-label">
                                    Order
                                </label>
                                <textarea
                                    class="form-control"
                                    id="pesan"
                                    rows="5"
                                    placeholder="Write Customer Order"
                                    required
                                ></textarea>
                            </div>
                            <button
                                type="submit"
                                class="btn btn-danger w-100">
                                Submit Order
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="order-container">
                    <h4 class="order-title mb-0">
                        List Order
                    </h4>
                    <span class="badge bg-danger fs-6">
                        Total Order :
                        <span id="totalOrder">0</span>
                    </span>
                    <hr>
                    <!-- TEMPAT MENAMPILKAN ORDERAN -->
                    <ul id="orderList" class="row g-3 list-unstyled">
                    </ul>
                </div>
            </div>
        </div>
    </main>
<!-- FOOTER -->
    <footer id="footer">
        <h5>Connect with Us</h5>
        <div class="social-icons">
            <a href="#" aria-label="LinkedIn">
                <i class="bi bi-linkedin"></i>
            </a>
            <a href="#" aria-label="Instagram">
                <i class="bi bi-instagram"></i>
            </a>
        </div>
        <p>
            2026 CafeNco Indonesia
        </p>
    </footer>
<!-- JAVASCRIPT  -->
    <script src="script.js"></script>

<!-- BOOTSTRAP JAVASCRIPT -->
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
